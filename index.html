<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ritmo Diario</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar" aria-label="Resumen">
        <div>
          <p class="eyebrow">Ritmo Diario</p>
          <h1 id="selectedDateTitle">Hoy</h1>
        </div>
        <div class="level-card" aria-label="Progreso de nivel">
          <div class="level-meta">
            <span id="levelLabel">Nivel 1</span>
            <span id="xpLabel">0 / 100 XP</span>
          </div>
          <div class="progress-track">
            <div id="xpBar" class="progress-fill"></div>
          </div>
          <p id="nextRewardText" class="next-reward">Proximo premio: nivel 5</p>

          <div class="stats-row compact-stats" aria-label="Estado del dia">
            <div>
              <span id="completedCount">0</span>
              <small>listas</small>
            </div>
            <div>
              <span id="pendingCount">0</span>
              <small>pendientes</small>
            </div>
            <div>
              <span id="dayXp">0</span>
              <small>XP del dia</small>
            </div>
          </div>

          <details class="reward-menu">
            <summary>
              <span>Premios</span>
              <small>Cada 5 niveles</small>
            </summary>
            <form id="rewardForm" class="reward-form">
              <div class="field">
                <label for="rewardLevel">Nivel</label>
                <select id="rewardLevel"></select>
              </div>
              <div class="field">
                <label for="rewardTitle">Premio</label>
                <input id="rewardTitle" type="text" placeholder="Ej: Merienda favorita" required />
              </div>
              <button class="primary-button" type="submit">Guardar</button>
            </form>
            <ul id="rewardList" class="reward-list"></ul>
          </details>
        </div>
      </section>

      <section class="date-panel" aria-label="Selector semanal">
        <div class="week-header">
          <button class="icon-button" id="prevWeek" aria-label="Semana anterior" title="Semana anterior">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
          </button>
          <div>
            <p class="section-label">Semana</p>
            <h2 id="weekTitle"></h2>
          </div>
          <button class="icon-button" id="nextWeek" aria-label="Semana siguiente" title="Semana siguiente">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
          </button>
          <button class="secondary-button" id="openCalendar" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" /></svg>
            Calendario
          </button>
        </div>
        <div id="weekStrip" class="week-strip"></div>
      </section>

      <section class="layout">
        <section class="task-panel" aria-label="Tareas">
          <div class="task-day-label">
            <span>Tareas para</span>
            <strong id="taskDateText">Hoy</strong>
          </div>

          <form id="taskForm" class="task-form">
            <div class="field">
              <label for="taskTitle">Tarea</label>
              <input id="taskTitle" type="text" autocomplete="off" placeholder="Ej: Leer 20 minutos" required />
            </div>
            <div class="field xp-field">
              <label for="taskXp">XP</label>
              <select id="taskXp">
                <option value="5">5 XP</option>
                <option value="10">10 XP</option>
                <option value="15">15 XP</option>
                <option value="20" selected>20 XP</option>
                <option value="25">25 XP</option>
                <option value="30">30 XP</option>
              </select>
            </div>
            <div class="field repeat-field">
              <label for="taskRepeat">Repetir</label>
              <select id="taskRepeat">
                <option value="day">Solo este dia</option>
                <option value="week">Todos los dias de esta semana</option>
                <option value="30days">Todos los dias por 30 dias</option>
              </select>
            </div>
            <button class="primary-button" type="submit">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
              Agregar
            </button>
          </form>

          <ul id="taskList" class="task-list" aria-label="Lista de tareas"></ul>
          <div id="emptyState" class="empty-state">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" /></svg>
            <p>No hay tareas para este dia.</p>
          </div>
        </section>
      </section>

      <div id="calendarOverlay" class="calendar-overlay" hidden>
        <aside class="calendar-panel" aria-label="Calendario">
          <div class="calendar-header">
            <button class="icon-button" id="prevMonth" aria-label="Mes anterior" title="Mes anterior">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
            </button>
            <h2 id="monthTitle"></h2>
            <button class="icon-button" id="nextMonth" aria-label="Mes siguiente" title="Mes siguiente">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
            </button>
            <button class="icon-button" id="closeCalendar" aria-label="Cerrar calendario" title="Cerrar calendario">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
            </button>
          </div>
          <div class="weekdays" aria-hidden="true">
            <span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
          </div>
          <div id="calendarGrid" class="calendar-grid"></div>
        </aside>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
